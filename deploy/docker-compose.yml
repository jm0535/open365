# Image-only compose copied to the deploy host by deploy.yml.
# The host does not need the source tree — only this file and remote-up.sh.
services:
  open365:
    image: ${OPEN365_IMAGE:?set OPEN365_IMAGE}
    ports:
      - "${OPEN365_PORT:-4173}:4173"
    environment:
      HOST: 0.0.0.0
      PORT: "4173"
      DATA_DIR: /data
    volumes:
      - open365-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  open365-data:
